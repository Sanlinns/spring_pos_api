spring.application.name=pos

app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:}}
#app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Set Secure=false only for local HTTP development. Use None only for cross-site HTTPS.
app.session.refresh-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:2592000}
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
app.session.cookie-same-site=${SESSION_COOKIE_SAME_SITE:Lax}
app.session.cookie-path=${SESSION_COOKIE_PATH:/api/auth}

app.admin.setup-key=${ADMIN_SETUP_KEY:}
app.admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
